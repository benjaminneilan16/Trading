<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0b0f19" />
<link rel="manifest" href="/manifest.json" />
<title>Crypto Bot</title>
<style>
  :root {
    --bg: #0b0f19;
    --panel: #131a2a;
    --line: #232c42;
    --text: #e7ecf7;
    --dim: #8792ab;
    --up: #3ddc97;
    --down: #ff5d5d;
    --accent: #f2b705;
    --mono: "SF Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px);
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 4px 12px;
  }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.2px; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--down);
    box-shadow: 0 0 8px var(--down);
    transition: background .3s, box-shadow .3s;
  }
  .dot.on { background: var(--up); box-shadow: 0 0 8px var(--up); }
  .status-row { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 13px; color: var(--dim); }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--dim);
    margin: 0 0 12px;
    font-weight: 600;
  }

  .btn-row { display: flex; gap: 10px; }
  button {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 14px 0;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: transform .1s, opacity .2s;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.4; }
  .btn-start { background: var(--up); color: #06231a; }
  .btn-stop { background: var(--down); color: #2a0505; }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
  }

  .feed-item {
    display: flex;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 13px;
  }
  .feed-item:last-child { border-bottom: none; }
  .feed-item .name { color: var(--text); }
  .feed-item .val { color: var(--dim); }
  .feed-item .val.err { color: var(--down); }

  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    background: #1c2438;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 5px 12px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--dim);
  }

  #toast {
    position: fixed;
    left: 16px; right: 16px; bottom: 24px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 14px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    transform: translateY(8px);
  }
  #toast.show { opacity: 1; transform: translateY(0); }

  .setup-note {
    font-size: 13px;
    color: var(--dim);
    line-height: 1.5;
  }
</style>
</head>
<body>

<header>
  <h1>Crypto Bot</h1>
  <div class="status-row"><span class="dot" id="dot"></span><span id="statusText">laddar…</span></div>
</header>

<div class="card">
  <h2>Kontroll</h2>
  <div class="btn-row">
    <button class="btn-start" id="startBtn">▶ Starta</button>
    <button class="btn-stop" id="stopBtn">■ Stoppa</button>
  </div>
</div>

<div class="card">
  <h2>Senaste insamling</h2>
  <div id="feed">
    <div class="feed-item"><span class="name">—</span><span class="val">väntar på data…</span></div>
  </div>
</div>

<div class="card">
  <h2>Symboler</h2>
  <div class="tag-row" id="symbolTags"></div>
</div>

<div class="card">
  <h2>Notiser</h2>
  <div class="btn-row">
    <button class="btn-ghost" id="notifyBtn">🔔 Skicka testnotis (Telegram)</button>
  </div>
  <p class="setup-note" style="margin-top:10px;">
    Kräver att TELEGRAM_BOT_TOKEN och TELEGRAM_CHAT_ID är ifyllda i .env på servern.
  </p>
</div>

<div class="card">
  <h2>Anslutning</h2>
  <p class="setup-note" id="connNote">Ansluter till <span id="apiUrlLabel"></span></p>
</div>

<div id="toast"></div>

<script>
  // ---- Konfiguration: sparas lokalt i webbläsaren på din iPhone ----
  const savedUrl = localStorage.getItem("api_url") || (location.origin);
  const savedKey = localStorage.getItem("api_key") || "";
  let API_URL = savedUrl;
  let API_KEY = savedKey;
  document.getElementById("apiUrlLabel").textContent = API_URL;

  if (!API_KEY) {
    const key = prompt("Ange din API-nyckel (samma som API_KEY i .env på servern):");
    if (key) {
      API_KEY = key;
      localStorage.setItem("api_key", key);
    }
  }

  const dot = document.getElementById("dot");
  const statusText = document.getElementById("statusText");
  const feed = document.getElementById("feed");
  const symbolTags = document.getElementById("symbolTags");
  const toast = document.getElementById("toast");

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2200);
  }

  async function refreshStatus() {
    try {
      const res = await fetch(`${API_URL}/api/status`);
      const data = await res.json();
      dot.classList.toggle("on", data.running);
      statusText.textContent = data.running ? "igång" : "stoppad";

      feed.innerHTML = "";
      const names = Object.keys(data.last_run);
      if (names.length === 0) {
        feed.innerHTML = `<div class="feed-item"><span class="name">—</span><span class="val">ingen data ännu</span></div>`;
      }
      for (const name of names) {
        const err = data.errors[name];
        const time = new Date(data.last_run[name]).toLocaleTimeString("sv-SE");
        feed.innerHTML += `<div class="feed-item"><span class="name">${name}</span><span class="val ${err ? "err" : ""}">${err ? "fel: " + err : time}</span></div>`;
      }

      symbolTags.innerHTML = data.symbols.map(s => `<span class="tag">${s}</span>`).join("");
    } catch (e) {
      statusText.textContent = "kan inte nå servern";
      dot.classList.remove("on");
    }
  }

  async function post(path) {
    return fetch(`${API_URL}${path}`, {
      method: "POST",
      headers: { "X-API-Key": API_KEY },
    });
  }

  document.getElementById("startBtn").addEventListener("click", async () => {
    const res = await post("/api/start");
    showToast(res.ok ? "Startad" : "Kunde inte starta — kolla API-nyckel");
    refreshStatus();
  });

  document.getElementById("stopBtn").addEventListener("click", async () => {
    const res = await post("/api/stop");
    showToast(res.ok ? "Stoppad" : "Kunde inte stoppa — kolla API-nyckel");
    refreshStatus();
  });

  document.getElementById("notifyBtn").addEventListener("click", async () => {
    const res = await post("/api/notify-test");
    showToast(res.ok ? "Testnotis skickad" : "Kunde inte skicka — kolla API-nyckel");
  });

  refreshStatus();
  setInterval(refreshStatus, 5000);

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/sw.js");
  }
</script>

</body>
</html>
